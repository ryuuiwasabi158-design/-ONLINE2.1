    <script>
        /**
         * 朝陽野銀行ONLINE2.0 Core Logic
         * Architected for strict localStorage compliance and responsive professional UI.
         */

        // Constants
        const ADMIN_ID = 'HuchuKanri';
        const ADMIN_PASS = '114514';
        const DB_PREFIX = 'asahino_v2_'; // Namespace for new version to avoid conflict
        const MAX_IMAGE_SIZE = 400; // max dimension for canvas compression

        // State
        let currentUser = null; // Email for students, ADMIN_ID for admin
        let currentView = '';

        // DOM Elements Map
        const els = {
            authView: document.getElementById('authView'),
            dashboardView: document.getElementById('dashboardView'),
            mainContent: document.getElementById('mainContent'),
            navMenu: document.getElementById('navMenu'),
            sidebarUserName: document.getElementById('sidebarUserName'),
            sidebarUserClassText: document.getElementById('sidebarUserClassText'),
            sidebar: document.getElementById('sidebar'),
            mobileOverlay: document.getElementById('mobileOverlay'),
            modal: document.getElementById('globalModal'),
            modalContent: document.getElementById('globalModalContent'),
            modalIcon: document.getElementById('modalIcon'),
            modalTitle: document.getElementById('modalTitle'),
            modalMessage: document.getElementById('modalMessage'),
            modalActions: document.getElementById('modalActions'),
            themeToggleBtn: document.getElementById('themeToggleBtn')
        };

        // --- Database Handlers ---
        function getDB(key, defaultVal) {
            try { 
                const data = localStorage.getItem(DB_PREFIX + key);
                return data ? JSON.parse(data) : defaultVal; 
            } catch { return defaultVal; }
        }
        function saveDB(key, val) {
            try { localStorage.setItem(DB_PREFIX + key, JSON.stringify(val)); } 
            catch (e) { showModal("保存エラー", "端末の保存容量の上限に達しました。不要なデータを削除してください。", "error"); }
        }
        function initDB() {
            if (!localStorage.getItem(DB_PREFIX + 'users')) {
                saveDB('users', {}); saveDB('requests', []); saveDB('market', []);
            }
        }

        // --- UI Utilities ---
        function showModal(title, message, type = 'info', confirmCallback = null) {
            els.modalTitle.textContent = title;
            els.modalMessage.textContent = message;
            
            // Icon styling based on type
            els.modalIcon.className = `w-10 h-10 rounded-full flex items-center justify-center text-xl shrink-0 `;
            if(type === 'error') els.modalIcon.className += 'bg-red-100 text-red-600', els.modalIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            else if(type === 'success') els.modalIcon.className += 'bg-green-100 text-green-600', els.modalIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
            else if(type === 'warning') els.modalIcon.className += 'bg-amber-100 text-amber-600', els.modalIcon.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
            else els.modalIcon.className += 'bg-blue-100 text-blue-600', els.modalIcon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';

            // Actions
            els.modalActions.innerHTML = '';
            if (confirmCallback) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = "bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 px-5 py-2.5 rounded-lg font-bold hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors tap-target";
                cancelBtn.textContent = "キャンセル";
                cancelBtn.onclick = hideModal;
                
                const confirmBtn = document.createElement('button');
                confirmBtn.className = type === 'error' || type === 'warning' ? "bg-red-600 text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-red-700 transition-colors tap-target" : "bg-brand-primary text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-brand-primary_hover transition-colors tap-target";
                confirmBtn.textContent = "確認";
                confirmBtn.onclick = () => { confirmCallback(); hideModal(); };
                
                els.modalActions.appendChild(cancelBtn);
                els.modalActions.appendChild(confirmBtn);
            } else {
                const okBtn = document.createElement('button');
                okBtn.className = "bg-brand-primary text-white px-6 py-2.5 rounded-lg font-bold shadow-md hover:bg-brand-primary_hover transition-colors tap-target";
                okBtn.textContent = "OK";
                okBtn.onclick = hideModal;
                els.modalActions.appendChild(okBtn);
            }

            els.modal.classList.remove('hidden');
            setTimeout(() => els.modalContent.classList.remove('scale-95'), 10);
        }

        function hideModal() {
            els.modalContent.classList.add('scale-95');
            setTimeout(() => els.modal.classList.add('hidden'), 150);
        }

        function toggleSidebar() {
            els.sidebar.classList.toggle('-translate-x-full');
            els.mobileOverlay.classList.toggle('hidden');
        }
        document.getElementById('mobileMenuBtn').addEventListener('click', toggleSidebar);
        els.mobileOverlay.addEventListener('click', toggleSidebar);

        function formatDateTime(dateString) {
            if(!dateString) return '-';
            const d = new Date(dateString);
            return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        // --- Core Application Functions ---

        // Image Compression via Canvas
        function compressImage(file, callback) {
            if (!file) return callback(null);
            if (!file.type.startsWith('image/')) {
                showModal("エラー", "画像ファイルを選択してください。", "error");
                return callback(null);
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_IMAGE_SIZE) {
                        height *= MAX_IMAGE_SIZE / width; width = MAX_IMAGE_SIZE;
                    } else if (height > MAX_IMAGE_SIZE) {
                        width *= MAX_IMAGE_SIZE / height; height = MAX_IMAGE_SIZE;
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    // Compress to JPEG, 0.6 quality keeps base64 string relatively small
                    callback(canvas.toDataURL('image/jpeg', 0.6)); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Navigation Builder
        function setNavigation() {
            const isAdmin = currentUser === ADMIN_ID;
            let navHtml = '';
            
            const navItem = (id, icon, text) => `
                <button onclick="loadView('${id}')" id="nav_${id}" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-left text-sm font-medium transition-all tap-target text-slate-400 hover:text-white hover:bg-slate-800/50 border border-transparent">
                    <i class="fa-solid ${icon} w-5 text-center"></i> ${text}
                </button>
            `;

            if (isAdmin) {
                navHtml += navItem('admin_dash', 'fa-chart-line', 'ダッシュボード');
                navHtml += navItem('admin_users', 'fa-users', '口座・ユーザー管理');
                navHtml += navItem('admin_requests', 'fa-money-bill-transfer', '入出金リクエスト');
                navHtml += navItem('admin_market', 'fa-store', 'マーケット監視');
                navHtml += navItem('admin_settings', 'fa-gear', 'システム設定');
            } else {
                navHtml += navItem('student_dash', 'fa-wallet', 'ダッシュボード');
                navHtml += navItem('market', 'fa-shop', 'マーケットプレイス');
            }
            els.navMenu.innerHTML = navHtml;
        }

        // Main View Router
        function loadView(viewId) {
            currentView = viewId;
            
            // Highlight active menu
            document.querySelectorAll('[id^="nav_"]').forEach(el => {
                el.classList.remove('bg-brand-primary/10', 'text-brand-primary', 'border-brand-primary/30', 'dark:text-brand-accent', 'dark:border-brand-accent/30', 'dark:bg-brand-accent/10');
                el.classList.add('text-slate-400', 'border-transparent');
            });
            const activeNav = document.getElementById(`nav_${viewId}`);
            if(activeNav) {
                activeNav.classList.remove('text-slate-400', 'border-transparent');
                activeNav.classList.add('bg-brand-primary/10', 'text-brand-primary', 'border-brand-primary/30', 'dark:text-brand-accent', 'dark:border-brand-accent/30', 'dark:bg-brand-accent/10');
            }

            if(window.innerWidth < 768 && !els.sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }

            // Fetch Data
            const users = getDB('users', {});
            const requests = getDB('requests', []);
            const market = getDB('market', []);

            let html = '';

            // --- VIEW: Student Dashboard ---
            if (viewId === 'student_dash') {
                const user = users[currentUser];
                const myReqs = requests.filter(r => r.userEmail === currentUser).reverse();
                
                html = `
                    <header class="mb-8">
                        <h2 class="text-2xl font-bold text-slate-800 dark:text-white">ダッシュボード</h2>
                        <p class="text-slate-500 text-sm mt-1">現在の口座状況と申請履歴</p>
                    </header>

                    <div class="bg-gradient-to-br from-brand-800 to-brand-900 rounded-2xl p-8 shadow-xl text-white mb-8 relative overflow-hidden">
                        <div class="absolute top-[-20%] right-[-10%] text-9xl opacity-[0.03] pointer-events-none"><i class="fa-solid fa-wallet"></i></div>
                        <p class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">Total Balance</p>
                        <div class="flex items-baseline gap-2">
                            <span class="text-5xl md:text-6xl font-black tracking-tight">${user.balance.toLocaleString()}</span>
                            <span class="text-2xl text-brand-accent font-bold">F</span>
                        </div>
                        <div class="mt-8 pt-4 border-t border-white/10 flex justify-between text-sm items-end">

                status: 'pending', 
                date: new Date().toISOString()

                const users = getDB('users', {});
                const buyer = users[currentUser];
                
                if(buyer.balance < item.price) return showModal("残高不足", "口座残高が不足しています。", "error");

                // Execute Transaction
                buyer.balance -= item.price;
                if(users[item.sellerEmail]) {
                    users[item.sellerEmail].balance += item.price;
                }

                item.status = 'sold';
                item.buyerEmail = currentUser;
                item.soldAt = new Date().toISOString();
                
                saveDB('users', users); 
                saveDB('market', market);
                showModal("購入完了", `「${item.name}」を購入しました！残高が変動しました。`, "success");
                loadView('market');
            });
        };

        window.reportItem = function(itemId) {
            showModal("通報確認", "この商品が悪質であると運営に通報しますか？虚偽の通報は処罰の対象になる場合があります。", "warning", () => {
                const market = getDB('market', []);
                const item = market.find(i => i.id === itemId);
                if(item) {
                    if(!item.reports.includes(currentUser)) {
                        item.reports.push(currentUser);
                        saveDB('market', market);
                        showModal("通報完了", "運営に通報しました。確認を行います。", "success");
                    } else {
                        showModal("通知", "既にこの商品を通報済みです。", "info");
                    }
                }
            });
        };

        window.showImage = function(src) {
            document.getElementById('imagePreview').src = src;
            document.getElementById('imagePreviewModal').classList.remove('hidden');
        };
        window.closeImagePreview = function() {
            document.getElementById('imagePreviewModal').classList.add('hidden');
        };

        // --- Admin Actions ---
        window.toggleUserStatus = function(email, type) {
            const users = getDB('users', {});
            if(users[email]) {
                const u = users[email];
                if(type === 'frozen') {
                    const action = u.status === 'frozen' ? '解除' : '凍結';
                    showModal("確認", `${u.name}さんの口座を${action}しますか？`, "warning", () => {
                        u.status = u.status === 'frozen' ? 'active' : 'frozen';
                        saveDB('users', users);
                        loadView('admin_users');
                    });
                } else if(type === 'banned') {
                    showModal("BAN確認", `${u.name}さんのアカウントを永久に停止(BAN)しますか？この操作は重大です。`, "error", () => {
                        u.status = 'banned';
                        saveDB('users', users);
                        loadView('admin_users');
                    });
                }
            }
        };

        window.addInterest = function() {
            const rate = parseFloat(document.getElementById('adminInterest').value);
            if(isNaN(rate) || rate < 0) return showModal("入力エラー", "正しい利息(%)を設定してください。", "warning");
            
            showModal("利息付与の確認", `有効な全口座に対して ${rate}% の利息を付与しますか？`, "info", () => {
                const users = getDB('users', {});
                let count = 0;
                for (const email in users) {
                    if (users[email].status === 'active' && users[email].balance > 0) {
                        users[email].balance += Math.floor(users[email].balance * (rate / 100));
                        count++;
                    }
                }
                saveDB('users', users);
                showModal("完了", `有効な口座 ${count} 件に利息 ${rate}% を付与しました。`, "success");
                loadView('admin_users');
            });
        };

        window.addInterestDash = function() {
            const rate = parseFloat(document.getElementById('dashAdminInterest').value);
            if(isNaN(rate) || rate < 0) return showModal("入力エラー", "正しい利息(%)を設定してください。", "warning");
            
            showModal("利息付与の確認", `有効な全口座に対して ${rate}% の利息を付与しますか？`, "info", () => {
                const users = getDB('users', {});
                let count = 0;
                for (const email in users) {
                    if (users[email].status === 'active' && users[email].balance > 0) {
                        users[email].balance += Math.floor(users[email].balance * (rate / 100));
                        count++;
                    }
                }
                saveDB('users', users);
                showModal("完了", `有効な口座 ${count} 件に利息 ${rate}% を付与しました。`, "success");
                loadView('admin_dash');
            });
        };

        window.processReq = function(reqId, action) {
            const requests = getDB('requests', []);
            const users = getDB('users', {});
            const req = requests.find(r => r.id === reqId);
            if(!req) return;
            const user = users[req.userEmail];

            if(!user || user.status !== 'active') return showModal("エラー", "対象ユーザーが存在しないか、アカウントが停止されています。", "error");

            if (action === 'approve') {
                if (req.type === 'deposit') user.balance += req.amount;
                else if (req.type === 'withdraw') {
                    if (user.balance < req.amount) return showModal("承認失敗", "ユーザーの残高が不足しているため、出金を承認できません。", "error");
                    user.balance -= req.amount;
                }
                req.status = 'approved';
            } else {
                req.status = 'rejected';
            }

            saveDB('users', users); 
            saveDB('requests', requests);
            loadView('admin_requests');
        };

        window.deleteMarketItem = function(itemId) {
            showModal("削除確認", "この出品データを完全に削除しますか？", "error", () => {
                let market = getDB('market', []);
                market = market.filter(i => i.id !== itemId);
                saveDB('market', market);
                loadView('admin_market');
            });
        };

        window.downloadCSV = function(type) {
            let dataArr = [];
            let headers = [];
            let filename = `asahino_${type}_${new Date().toISOString().slice(0,10)}.csv`;

            if (type === 'users') {
                const users = getDB('users', {});
                headers = ['Email(ID)', '名前', '学年', '組', '番号', '残高(F)', '状態'];
                dataArr = Object.entries(users).map(([email, u]) => [email, u.name, u.grade, u.class, u.number, u.balance, u.status]);
            } else if (type === 'requests') {
                const requests = getDB('requests', []);
                headers = ['ID', '日時', 'ユーザーEmail', '種別', '金額(F)', '状態'];
                dataArr = requests.map(r => [r.id, r.date, r.userEmail, r.type, r.amount, r.status]);
            } else if (type === 'market') {
                const market = getDB('market', []);
                headers = ['ID', '出品日時', '商品名', '価格(F)', '出品者', '購入者', '状態', '購入日時', '通報数'];
                dataArr = market.map(m => [m.id, m.createdAt, m.name, m.price, m.sellerEmail, m.buyerEmail||'', m.status, m.soldAt||'', m.reports?m.reports.length:0]);
            }

            // Create CSV string
            let csvContent = "\uFEFF"; // BOM for Excel UTF-8
            csvContent += headers.join(',') + '\n';
            dataArr.forEach(row => {
                const rowStr = row.map(cell => {
                    let c = String(cell);
                    if(c.includes(',') || c.includes('"') || c.includes('\n')) {
                        return `"${c.replace(/"/g, '""')}"`;
                    }
                    return c;
                }).join(',');
                csvContent += rowStr + '\n';
            });

            // Trigger download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.confirmResetData = function() {
            showModal("【警告】全データ削除", "本当に全てのデータを削除してシステムを初期化しますか？復元はできません！", "error", () => {
                // Clear specific prefix keys
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith(DB_PREFIX)) localStorage.removeItem(key);
                });
                location.reload();
            });
        };

        // --- Authentication ---
        function switchAuthTab(isLogin) {
            const lTab = document.getElementById('tabLogin');
            const rTab = document.getElementById('tabRegister');
            if(isLogin) {
                lTab.className = "flex-1 py-3 text-center border-b-2 border-brand-primary text-brand-primary font-bold transition-colors";
                rTab.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 transition-colors tap-target";
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                rTab.className = "flex-1 py-3 text-center border-b-2 border-brand-primary text-brand-primary font-bold transition-colors";
                lTab.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 transition-colors tap-target";
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
            }
        }
        document.getElementById('tabLogin').addEventListener('click', () => switchAuthTab(true));
        document.getElementById('tabRegister').addEventListener('click', () => switchAuthTab(false));

        document.getElementById('doRegisterBtn').addEventListener('click', () => {
            const name = document.getElementById('regName').value.trim();
            const grade = document.getElementById('regGrade').value;
            const cls = document.getElementById('regClass').value;
            const num = document.getElementById('regNumber').value;
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;

            if (!name || !grade || !cls || !num || !email || !pass) return showModal("入力エラー", "すべての項目を正しく入力してください。", "warning");
            
            const users = getDB('users', {});
            if (users[email]) return showModal("登録エラー", "このメールアドレスは既に登録されています。", "error");

            users[email] = { name, grade, class: cls, number: num, email, password: pass, balance: 0, status: 'active' };
            saveDB('users', users);
            
            showModal("口座開設完了", "口座を開設しました。ログイン画面からログインしてください。", "success", () => {
                switchAuthTab(true);
                document.getElementById('loginId').value = email;
            });
        });

        document.getElementById('doLoginBtn').addEventListener('click', () => {
            const id = document.getElementById('loginId').value.trim();
            const pass = document.getElementById('loginPass').value;

            if (id === ADMIN_ID && pass === ADMIN_PASS) {
                currentUser = ADMIN_ID;
                setupDashboard();
                return;
            }

            const users = getDB('users', {});
            const user = users[id];

            if (user && user.password === pass) {
                if (user.status === 'banned') return showModal("アクセス拒否", "このアカウントは運営により永久停止されています。", "error");
                if (user.status === 'frozen') return showModal("アクセス制限", "この口座は現在凍結されています。管理者に連絡してください。", "warning");
                currentUser = id;
                setupDashboard();
            } else {
                showModal("ログイン失敗", "ID(メールアドレス)またはパスワードが間違っています。", "error");
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            currentUser = null;
            document.getElementById('loginId').value = '';
            document.getElementById('loginPass').value = '';
            els.dashboardView.classList.add('hidden');
            els.authView.classList.remove('hidden');
            if(!els.sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        });

        function setupDashboard() {
            els.authView.classList.add('hidden');
            els.dashboardView.classList.remove('hidden');
            
            if(currentUser === ADMIN_ID) {
                els.sidebarUserName.textContent = "システム管理者";
                els.sidebarUserClassText.textContent = "Admin Root Access";
                setNavigation();
                loadView('admin_dash');
            } else {
                const user = getDB('users', {})[currentUser];
                els.sidebarUserName.textContent = user.name;
                els.sidebarUserClassText.textContent = `${user.grade}年${user.class}組 ${user.number}番`;
                setNavigation();
                loadView('student_dash');
            }
        }

        // --- Theme Management ---
        function applyTheme(isDark) {
            if(isDark) {
                document.documentElement.classList.add('dark');
                els.themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            } else {
                document.documentElement.classList.remove('dark');
                els.themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        }
        
        els.themeToggleBtn.addEventListener('click', () => {
            const willBeDark = !document.documentElement.classList.contains('dark');
            applyTheme(willBeDark);
            localStorage.setItem(DB_PREFIX + 'theme', willBeDark ? 'dark' : 'light');
        });

        // --- Initialization ---
        initDB();
        const savedTheme = localStorage.getItem(DB_PREFIX + 'theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            applyTheme(true);
        } else {
            applyTheme(false);
        }
    </script>
